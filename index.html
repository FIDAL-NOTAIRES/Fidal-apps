<style>
  :root{
    --navy:#0F2238; --navy-2:#091525; --navy-soft:#16314f;
    --ink:#1A1A1A; --paper:#FFFFFF;
    --gold:#FFC900; --gold-soft:#FFE764;
    --steel:#657D96; --orange:#FF982D;
    --line:rgba(255,255,255,.10);
    --muted:rgba(255,255,255,.56);
    --serif:"Gelasio",Georgia,"Times New Roman",serif;
    --sans:"Open Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--sans);
    background:var(--navy-2);
    color:var(--paper);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  /* device frame on desktop, full-bleed on phones */
  #device{
    position:relative;
    width:100%;height:100%;
    max-width:430px;max-height:932px;
    margin:0 auto;
    overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, var(--navy-soft) 0%, var(--navy) 42%, var(--navy-2) 100%);
  }
  @media (min-width:480px) and (min-height:760px){
    body{display:flex;align-items:center;justify-content:center;
      background:#05101d;
      background-image:radial-gradient(60% 60% at 50% 30%, #0d2034 0%, #05101d 70%);}
    #device{height:920px;border-radius:46px;
      box-shadow:0 0 0 11px #05080d, 0 0 0 13px #20242c, 0 40px 90px -20px rgba(0,0,0,.75);
    }
  }
  /* faint engraved guilloché backdrop */
  #device::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:
      radial-gradient(closest-side at 50% 20%, rgba(255,201,0,.06), transparent 70%),
      repeating-radial-gradient(circle at 50% 18%, rgba(255,255,255,.022) 0 1px, transparent 1px 16px);
    mask:linear-gradient(#000,transparent 78%);
    -webkit-mask:linear-gradient(#000,transparent 78%);
  }

  /* ===== status bar ===== */
  .statusbar{
    position:relative;z-index:5;
    height:calc(44px + var(--safe-top));
    padding:var(--safe-top) 26px 0;
    display:flex;align-items:center;justify-content:space-between;
    font-size:15px;font-weight:600;letter-spacing:.2px;
  }
  /* En app installée (plein écran), le téléphone affiche déjà sa propre barre : on masque la nôtre */
  @media (display-mode:standalone),(display-mode:fullscreen){ .statusbar{display:none;} }
  body.standalone .statusbar{display:none;}
  .statusbar .right{display:flex;align-items:center;gap:7px;}
  .statusbar svg{display:block;}
  .sig{display:flex;align-items:flex-end;gap:2px;height:11px;}
  .sig i{width:3px;background:#fff;border-radius:1px;display:block;}
  .sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}
  .sig i:nth-child(3){height:8px}.sig i:nth-child(4){height:11px}

  /* ===== home screen ===== */
  #home{position:absolute;inset:0;display:flex;flex-direction:column;z-index:2;}
  .home-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:30px;}

  .masthead{padding:34px 30px 8px;margin-top:5vh;}
  .masthead .eyebrow{
    font-size:10.5px;letter-spacing:4.5px;font-weight:600;
    color:var(--gold);text-transform:uppercase;margin-bottom:10px;opacity:.92;
  }
  .wordmark{display:flex;align-items:baseline;gap:11px;}
  .wordmark .f{font-family:var(--serif);font-weight:700;font-size:36px;line-height:1;color:#F2F6F7;letter-spacing:.5px;}
  .wordmark .slash{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1;color:#E3CC7A;}
  .wordmark .n{font-size:13px;letter-spacing:4px;font-weight:600;color:#F2F6F7;text-transform:uppercase;}
  .masthead .sub{margin-top:14px;font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--muted);}

  .section-label{
    padding:26px 30px 6px;font-size:11px;letter-spacing:3px;font-weight:600;
    text-transform:uppercase;color:rgba(255,255,255,.40);
  }

  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:22px 14px;padding:14px 26px 6px;
  }
  .app{
    background:none;border:0;padding:0;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    color:#fff;font-family:inherit;
    opacity:0;transform:translateY(14px);
    animation:rise .55s cubic-bezier(.22,.61,.36,1) forwards;
  }
  .app:nth-child(1){animation-delay:.05s}
  .app:nth-child(2){animation-delay:.13s}
  .app:nth-child(3){animation-delay:.21s}
  @keyframes rise{to{opacity:1;transform:none}}
  .tile{
    position:relative;width:78px;height:78px;border-radius:21px;
    display:grid;place-items:center;
    background:linear-gradient(155deg,#1b3a5c 0%, #102844 55%, #0c2038 100%);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 10px 22px -10px rgba(0,0,0,.7),
               inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .tile::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:radial-gradient(120% 90% at 50% 0%, var(--accent-glow,rgba(255,201,0,.16)), transparent 62%);
    pointer-events:none;
  }
  .tile svg{width:66px;height:66px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));position:relative;z-index:1;}
  .app:active .tile{transform:scale(.9);}
  .app .name{font-size:12px;letter-spacing:1.5px;font-weight:600;text-transform:uppercase;}
  .app .name small{display:block;font-family:var(--serif);font-style:italic;
    font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px;font-weight:400;}

  .hint{
    margin:30px 30px 0;padding:16px 18px;border-radius:16px;
    background:rgba(255,255,255,.04);border:1px solid var(--line);
    font-size:12px;line-height:1.55;color:var(--muted);
  }
  .hint b{color:var(--gold-soft);font-weight:600;}

  /* dock / home indicator */
  .home-indicator{
    position:absolute;left:0;right:0;bottom:0;z-index:6;
    height:calc(26px + var(--safe-bottom));
    display:flex;align-items:flex-start;justify-content:center;
    padding-top:8px;pointer-events:none;
  }
  .home-indicator i{width:135px;height:5px;border-radius:3px;background:rgba(255,255,255,.5);}

  /* ===== in-app view ===== */
  #appview{
    position:absolute;inset:0;z-index:10;background:#fff;
    display:flex;flex-direction:column;
    transform:translateX(100%);
    transition:transform .34s cubic-bezier(.32,.72,0,1);
    will-change:transform;
  }
  #appview.open{transform:none;}
  .appbar{
    flex:0 0 auto;background:var(--navy);color:#fff;
    padding:var(--safe-top) 8px 0;
    height:calc(52px + var(--safe-top));
    display:flex;align-items:center;gap:4px;
  }
  .appbar button{
    background:none;border:0;color:#fff;cursor:pointer;
    height:42px;min-width:42px;border-radius:11px;
    display:grid;place-items:center;font-family:inherit;
    transition:background .15s;
  }
  .appbar button:active{background:rgba(255,255,255,.12);}
  .appbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .appbar .title{flex:1;text-align:center;font-size:13px;font-weight:600;
    letter-spacing:1.5px;text-transform:uppercase;}
  .appbar .title small{display:block;font-family:var(--serif);font-style:italic;
    font-weight:400;font-size:10px;letter-spacing:0;text-transform:none;color:var(--gold-soft);margin-top:1px;}
  .frame-wrap{position:relative;flex:1;background:#fff;}
  #appframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;}

  .loader{position:absolute;inset:0;display:grid;place-items:center;background:#fff;
    transition:opacity .3s;gap:0;}
  .loader.hide{opacity:0;pointer-events:none;}
  .spin{width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(15,34,56,.15);border-top-color:var(--navy);
    animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .fallback{position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:34px;text-align:center;
    background:#fff;color:var(--ink);}
  .fallback.show{display:flex;}
  .fallback p{font-size:14px;line-height:1.55;color:#44505c;max-width:280px;margin:0;}
  .fallback .ext-btn{
    background:var(--navy);color:#fff;border:0;border-radius:13px;
    padding:14px 22px;font-size:14px;font-weight:600;letter-spacing:.5px;
    font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:9px;
  }
  .fallback .ext-btn svg{width:18px;height:18px;}

  /* ===== splash ===== */
  #splash{position:absolute;inset:0;z-index:50;background:
    radial-gradient(120% 90% at 50% 35%, var(--navy-soft), var(--navy) 55%, var(--navy-2));
    display:grid;place-items:center;transition:opacity .5s .15s;}
  #splash.hide{opacity:0;pointer-events:none;}
  #splash .seal{width:128px;height:128px;animation:sealin .9s cubic-bezier(.22,.61,.36,1) both;}
  @keyframes sealin{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
  #splash .name{position:absolute;bottom:13%;text-align:center;
    animation:sealin .9s .15s cubic-bezier(.22,.61,.36,1) both;}
  #splash .name .f{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:1px;}
  #splash .name .n{font-size:11px;letter-spacing:6px;color:var(--muted);margin-top:5px;}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;transition-duration:.08s!important;}
  }
</style>

  { id:"countdown", name:"Countdown", tag:"Frais d'acte",
    url:"https://countdown-kappa-azure.vercel.app/",
    icon:'<svg viewBox="0 0 78 78" xmlns="http://www.w3.org/2000/svg"><g transform="translate(39 39) scale(0.8712) translate(-38.9 -38.9)"><g stroke="#4E98A0" stroke-width="2.6" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="22" y="14" width="34" height="50" rx="8"/><rect x="27.5" y="20.5" width="23" height="9" rx="2.5"/></g><g fill="#4E98A0"><rect x="28" y="36" width="7" height="4.2" rx="2.1"/><rect x="35.5" y="36" width="7" height="4.2" rx="2.1"/><rect x="43" y="36" width="7" height="4.2" rx="2.1"/><rect x="28" y="44" width="7" height="4.2" rx="2.1"/><rect x="35.5" y="44" width="7" height="4.2" rx="2.1"/><rect x="43" y="44" width="7" height="4.2" rx="2.1"/><rect x="28" y="52" width="7" height="4.2" rx="2.1"/><rect x="35.5" y="52" width="7" height="4.2" rx="2.1"/></g><circle cx="46.5" cy="54.1" r="3.7" fill="#E3CC7A"/></g></svg>' },

/* ---- build home grid ---- */
const grid = document.getElementById("grid");
APPS.forEach(a=>{
  const b = document.createElement("button");
  b.className = "app";
  b.innerHTML =
    '<span class="tile" style="--accent-glow:rgba(78,152,160,.15)">'+a.icon+'</span>'+
    '<span class="name">'+a.name+'<small>'+a.tag+'</small></span>';
  b.addEventListener("click", ()=>openApp(a));
  grid.appendChild(b);
});

/* ---- in-app navigation ---- */
const appview  = document.getElementById("appview");
const frame    = document.getElementById("appframe");
const loader   = document.getElementById("loader");
const fallback = document.getElementById("fallback");
let current = null, loadTimer = null;

function openApp(a){
  current = a;
  document.getElementById("appTitle").textContent = a.name;
  document.getElementById("appSub").textContent   = a.tag;
  loader.classList.remove("hide");
  fallback.classList.remove("show");
  frame.src = a.url;
  appview.classList.add("open");
  history.pushState({app:a.id}, "", "#"+a.id);

  clearTimeout(loadTimer);
  loadTimer = setTimeout(()=>{        // si rien n'a chargé : proposer le navigateur
    if(!loader.classList.contains("hide")){
      loader.classList.add("hide");
      fallback.classList.add("show");
    }
  }, 6000);
}
frame.addEventListener("load", ()=>{
  // une frame "vide" (bloquée) garde souvent about:blank ; on tente d'afficher quand même
  loader.classList.add("hide");
  fallback.classList.remove("show");
  clearTimeout(loadTimer);
});
function goHome(){
  appview.classList.remove("open");
  setTimeout(()=>{ frame.src="about:blank"; }, 340);
  if(location.hash) history.replaceState(null,"",location.pathname+location.search);
}

document.getElementById("backBtn").addEventListener("click", ()=>{ history.back(); });
document.getElementById("reloadBtn").addEventListener("click", ()=>{
  if(current){ loader.classList.remove("hide"); fallback.classList.remove("show"); frame.src = current.url; }
});
document.getElementById("extBtn").addEventListener("click", openExternal);
document.getElementById("fallbackBtn").addEventListener("click", openExternal);
function openExternal(){ if(current) window.open(current.url, "_blank", "noopener"); }

window.addEventListener("popstate", ()=>{
  if(appview.classList.contains("open")) goHome();
});

/* ---- live clock ---- */
function tick(){
  const d = new Date();
  document.getElementById("clock").textContent =
    d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
}
tick(); setInterval(tick, 10000);

/* ---- mode app installée : masquer la fausse barre d'état (doublon avec celle du téléphone) ---- */
if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches){
  document.body.classList.add('standalone');
}

/* ---- splash ---- */
window.addEventListener("load", ()=>{
  setTimeout(()=>document.getElementById("splash").classList.add("hide"), 1050);
});
